name: Build and deploy blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 不在上传过程中取消正在运行的部署，也不同时写入服务器目录。
concurrency:
  group: blog-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build blog
        run: |
          npm run build
          test -s dist/index.html

      - name: Deploy dist over SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH}}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          fail() {
            printf '::error::%s\n' "$1" >&2
            exit 1
          }

          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_PATH:?Missing DEPLOY_PATH}"
          : "${SSH_PRIVATE_KEY:?Missing SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Missing SSH_KNOWN_HOSTS}"

          # 只接受 DNS/IPv4 主机、普通用户名和专用绝对路径，防止误同步根目录。
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || \
            fail 'DEPLOY_HOST 格式错误：只填写 IPv4 或域名，不要包含协议、端口、路径、引号或空白。'
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]] || \
            fail 'DEPLOY_USER 格式错误：只填写 Linux 用户名，不要包含 @主机名、引号或空白。'
          [[ "$DEPLOY_PORT" =~ ^[1-9][0-9]{0,4}$ ]] || \
            fail 'DEPLOY_PORT 格式错误：只填写 1 到 65535 之间的端口数字。'
          (( DEPLOY_PORT <= 65535 )) || \
            fail 'DEPLOY_PORT 超出范围：端口必须在 1 到 65535 之间。'
          DEPLOY_PATH="${DEPLOY_PATH%/}"
          [[ "$DEPLOY_PATH" =~ ^(/[a-zA-Z0-9_][a-zA-Z0-9_.-]*){2,}$ ]] || \
            fail 'DEPLOY_PATH 格式错误：请填写普通绝对路径，不要包含引号、空白、.. 或多余斜杠。'

          umask 077
          key_file="$RUNNER_TEMP/blog-deploy.key"
          hosts_file="$RUNNER_TEMP/blog-known-hosts"
          trap 'rm -f -- "$key_file" "$hosts_file"' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$key_file"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$hosts_file"
          unset SSH_PRIVATE_KEY SSH_KNOWN_HOSTS
          ssh-keygen -y -P '' -f "$key_file" >/dev/null 2>&1 || \
            fail 'SSH_PRIVATE_KEY 不是有效的无密码 OpenSSH 私钥。'

          known_host="$DEPLOY_HOST"
          if (( DEPLOY_PORT != 22 )); then
            known_host="[$DEPLOY_HOST]:$DEPLOY_PORT"
          fi
          ssh-keygen -F "$known_host" -f "$hosts_file" >/dev/null || \
            fail 'SSH_KNOWN_HOSTS 中没有与 DEPLOY_HOST 和 DEPLOY_PORT 匹配的记录。'

          ssh_options=(
            -i "$key_file"
            -p "$DEPLOY_PORT"
            -o "UserKnownHostsFile=$hosts_file"
            -o StrictHostKeyChecking=yes
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o ConnectTimeout=15
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          # 目录由管理员预先创建，部署账号无需 sudo。
          ssh "${ssh_options[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "test -d '$DEPLOY_PATH' && test -w '$DEPLOY_PATH' && command -v rsync >/dev/null"

          # dist/ 的尾斜杠表示只同步目录内容；保留 ACME 证书验证目录。
          # --delete-delay 会删除目标目录里已不在 dist 中的旧文件。
          RSYNC_RSH=ssh
          for option in "${ssh_options[@]}"; do
            printf -v RSYNC_RSH '%s %q' "$RSYNC_RSH" "$option"
          done
          export RSYNC_RSH
          rsync -az --delete-delay --delay-updates \
            --no-owner --no-group --omit-dir-times --chmod=D755,F644 \
            --exclude='/.well-known/' \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
